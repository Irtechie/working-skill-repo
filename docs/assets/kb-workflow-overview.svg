<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <!-- Render at 1672x941 in a headless Chromium screenshot to update the sibling PNG. -->
  <title id="title">KB workflow overview</title>
  <desc id="desc">Requests enter through kb-start and kb-map, use the smallest fitting lane, execute through one DDR owner, pass targeted proof and an exact-tree gate, reach configured delivery, and return through a durable handoff or restart.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 38px "Segoe UI", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 19px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .phase { font: 700 17px "Segoe UI", Arial, sans-serif; letter-spacing: 1.6px; fill: #475569; }
      .label { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .detail { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 9; marker-end: url(#arrow); }
      .edge-label { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .entry { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .memory { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; }
      .lane { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .execution { fill: #ede9fe; stroke: #7c3aed; stroke-width: 3; }
      .proof { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .delivery { fill: #ccfbf1; stroke: #0f766e; stroke-width: 3; }
      .continuity { fill: #f1f5f9; stroke: #475569; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1672" height="941" fill="#f8fafc"/>
  <text x="64" y="64" class="title">KB workflow overview</text>
  <text x="64" y="98" class="subtitle">One route from request to proof, delivery, and a durable restart</text>

  <text x="64" y="145" class="phase">1 - ORIENT AND ROUTE</text>

  <ellipse cx="112" cy="244" rx="64" ry="48" class="entry"/>
  <text x="112" y="251" class="label">Request</text>

  <path d="M176 244 H217" class="edge"/>

  <rect x="226" y="184" width="206" height="120" rx="18" class="entry"/>
  <text x="329" y="231" class="label">kb-start</text>
  <text x="329" y="263" class="detail">route the request</text>

  <path d="M432 244 H473" class="edge"/>

  <rect x="482" y="184" width="220" height="120" rx="18" class="memory"/>
  <text x="592" y="231" class="label">kb-map</text>
  <text x="592" y="263" class="detail">anchor project memory</text>

  <path d="M702 244 H739" class="edge"/>

  <polygon points="824,174 928,244 824,314 720,244" class="lane"/>
  <text x="824" y="232" class="detail">choose the</text>
  <text x="824" y="260" class="label">smallest lane</text>

  <path d="M928 244 H969" class="edge"/>

  <rect x="978" y="184" width="270" height="120" rx="18" class="lane"/>
  <text x="1113" y="226" class="label">Lane owner</text>
  <text x="1113" y="258" class="detail">fix / task / plan-work</text>
  <text x="1113" y="284" class="detail">complete / epic</text>

  <path d="M1248 244 H1341 V385" class="edge"/>
  <text x="1357" y="333" class="edge-label">planned execution</text>

  <text x="64" y="384" class="phase">2 - EXECUTE AND PROVE</text>

  <polygon points="1341,386 1487,458 1341,530 1195,458" class="execution"/>
  <text x="1341" y="438" class="label">DDR: one owner</text>
  <text x="1341" y="470" class="small">no automatic</text>
  <text x="1341" y="494" class="small">downward routing</text>

  <path d="M1225 443 H1090 V428 H1037" class="edge"/>
  <path d="M1225 473 H1090 V536 H1037" class="edge"/>

  <rect x="817" y="380" width="220" height="96" rx="16" class="execution"/>
  <text x="927" y="417" class="label">Current</text>
  <text x="927" y="448" class="detail">qualified exception only</text>

  <rect x="817" y="488" width="220" height="96" rx="16" class="execution"/>
  <text x="927" y="525" class="label">One subagent</text>
  <text x="927" y="556" class="detail">same tier or higher</text>

  <path d="M817 428 H752 V466 H707" class="edge"/>
  <path d="M817 536 H752 V498 H707" class="edge"/>

  <rect x="475" y="422" width="232" height="120" rx="18" class="proof"/>
  <text x="591" y="469" class="label">Targeted proof</text>
  <text x="591" y="501" class="detail">reuse valid receipts</text>

  <path d="M475 482 H426" class="edge"/>

  <rect x="194" y="422" width="232" height="120" rx="18" class="proof"/>
  <text x="310" y="469" class="label">Exact-tree gate</text>
  <text x="310" y="497" class="detail">one final check</text>
  <text x="310" y="522" class="detail">after review fixes</text>

  <path d="M310 542 V600 H382 V710" class="edge"/>

  <text x="64" y="657" class="phase">3 - DELIVER AND CONTINUE</text>

  <polygon points="310,672 432,736 310,800 188,736" class="delivery"/>
  <text x="310" y="725" class="label">Configured</text>
  <text x="310" y="754" class="label">delivery</text>

  <path d="M390 714 L491 680" class="edge"/>
  <path d="M432 736 L491 750" class="edge"/>
  <path d="M390 758 L491 820" class="edge"/>

  <rect x="500" y="650" width="142" height="60" rx="16" class="delivery"/>
  <text x="571" y="688" class="label">Local</text>

  <rect x="500" y="720" width="142" height="60" rx="16" class="delivery"/>
  <text x="571" y="758" class="label">PR</text>

  <rect x="500" y="790" width="142" height="60" rx="16" class="delivery"/>
  <text x="571" y="828" class="label">Direct</text>

  <path d="M642 680 L791 705" class="edge"/>
  <path d="M642 750 L791 740" class="edge"/>
  <path d="M642 820 L791 775" class="edge"/>

  <rect x="800" y="675" width="330" height="130" rx="18" class="continuity"/>
  <text x="965" y="727" class="label">Handoff or restart</text>
  <text x="965" y="759" class="detail">durable state, not chat history</text>

  <path d="M1130 740 H1572 V888 H30 V340 H329 V314" class="loop"/>
  <rect x="674" y="862" width="324" height="34" rx="12" fill="#f8fafc"/>
  <text x="836" y="885" class="edge-label" text-anchor="middle">next request or resume via kb-start + kb-map</text>
</svg>
