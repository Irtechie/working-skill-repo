instincts:
  - id: bound-fanout-with-observed-cost
    scope: model-routing/orchestration
    trigger: "when considering multiple concurrent agent or model attempts for one workflow"
    behavior: "pre-register the maximum branch count, per-branch budget, aggregate budget, and stop condition from observed telemetry; never authorize fan-out from an agent's self-estimated token cost"
    confidence: 0.49
    domain: workflow
    observations: 1
    first_seen: 2026-07-22
    last_seen: 2026-07-22
    evidence:
      - "Bai et al., arXiv:2604.22750v2 (2026-04-29): same-task token use varied by up to 30x, frontier models underpredicted consumption, and prediction correlation reached only 0.39"
      - "Curated ATV Community Call and Hack & Furious evidence (2026-05-18 through 2026-07-22): participants treated swarms as selective rather than universal and identified large-scale parallel development as unsolved"
  - id: fanout-by-independent-proof-boundaries
    scope: model-routing/orchestration
    trigger: "when a workflow has several isolated hypotheses, artifacts, chunks, or review dimensions with independent proof"
    behavior: "fan out by non-overlapping ownership and give each branch its own bounded context and oracle; use duplicate attempts only for an explicitly designed stochastic evaluation"
    confidence: 0.49
    domain: architecture
    observations: 1
    first_seen: 2026-07-22
    last_seen: 2026-07-22
    evidence:
      - "Curated ATV Hack & Furious evidence (2026-07-14): the concrete successful swarm example assigned specialized security, privacy, PII, review-comment, and test-failure audits rather than duplicating one undifferentiated task"
      - "Curated ATV Community Call evidence (2026-07-21 through 2026-07-22): multi-agent discussion emphasized document chunking, load management, and workflow/data segmentation"
  - id: fanin-valid-evidence-not-agent-consensus
    scope: model-routing/orchestration
    trigger: "when concurrent agent branches return findings or changes for integration"
    behavior: "reject invalid branches first, then aggregate proof-bound evidence through deterministic checks and explicit conflict resolution; do not treat majority vote, fluent agreement, or self-reported success as authority"
    confidence: 0.49
    domain: testing
    observations: 1
    first_seen: 2026-07-22
    last_seen: 2026-07-22
    evidence:
      - "Curated ATV Hack & Furious evidence (2026-07-14): review swarms evaluated distinct risk surfaces and resolved findings before distributed work merged to main"
      - "docs/context/kb/instincts/scoped/model-routing/evaluation.yaml: evaluation authority comes from hash-bound protected artifacts, and invalid evaluation evidence stops correction or promotion"
  - id: optimize-cost-per-valid-result
    scope: model-routing/orchestration
    trigger: "when comparing direct, routed, speculative, or multi-agent execution strategies"
    behavior: "compare total input, output, retry, correction, fan-in, and failed-attempt cost per deterministically valid result; do not infer efficiency from output tokens, billed model price, or nominal parallel speed alone"
    confidence: 0.58
    domain: testing
    observations: 2
    first_seen: 2026-07-13
    last_seen: 2026-07-22
    evidence:
      - "Bai et al., arXiv:2604.22750v2 (2026-04-29): agentic coding used about 1000x the tokens of code reasoning/chat, input tokens drove cost, and higher token use did not imply higher accuracy"
      - "docs/results/2026-07-13-qwen-sol-exploratory-cost.md: Qwen plus Sol fallback added 106.4% token workload while producing no valid result, leaving cost per success undefined"
      - "Curated ATV Community Call and Hack & Furious evidence (2026-07-09 through 2026-07-21): cost discussions centered on measured token consumption and business outcome rather than model invocation count"
  - id: widen-parallelism-only-after-proof
    scope: model-routing/orchestration
    trigger: "when deciding whether to add more agent branches, retries, or stronger-model passes"
    behavior: "start with the smallest qualified execution shape and widen only when valid paired evidence shows incremental accuracy or risk reduction justifies the marginal aggregate cost"
    confidence: 0.49
    domain: workflow
    observations: 1
    first_seen: 2026-07-22
    last_seen: 2026-07-22
    evidence:
      - "Bai et al., arXiv:2604.22750v2 (2026-04-29): accuracy often peaked at intermediate token cost and saturated at higher consumption"
      - "Curated ATV Community Call evidence (2026-05-18): swarms were described as useful for some projects and long-running work, not as a universal default"
