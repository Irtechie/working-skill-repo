instincts:
  - id: derive-evaluation-authority-from-bound-artifacts
    scope: model-routing/evaluation
    trigger: "when an evaluation field can change readiness, cost, correctness, pairing, support, or promotion"
    behavior: "derive the field from hash-bound protected artifacts and recompute it in the validator; never authorize from caller-authored booleans or digest labels"
    confidence: 0.45
    domain: testing
    observations: 1
    first_seen: 2026-07-12
    last_seen: 2026-07-12
    evidence:
      - "2026-07-12 GHCP AIC review: self-authored route_match, oracle_intact, context hashes, and promotion summaries were replaced or made unable to promote"
      - "docs/solutions/logic-errors/proof-spine-digest-check-semantics-2026-07-05.md updated with evaluation-harness artifact binding"
  - id: fail-closed-when-paid-approval-is-not-trusted
    scope: model-routing/evaluation
    trigger: "when a model benchmark can spend credits but the runtime cannot independently verify human approval"
    behavior: "hard-disable provider execution and expose only a zero-spend dry-run approval preview until a trusted approval adapter exists"
    confidence: 0.45
    domain: workflow
    observations: 1
    first_seen: 2026-07-12
    last_seen: 2026-07-12
    evidence:
      - "2026-07-12 final security review: local approval JSON remained self-authorizing, so cmd/amrbench run now refuses every non-dry execution before config, profile, secret, or provider access"
  - id: stop-escalation-on-invalid-evaluation-evidence
    scope: model-routing/evaluation
    trigger: "when a model attempt has process, telemetry, route, accounting, application, isolation, or proof-infrastructure invalidity"
    behavior: "classify the arm invalid and stop before fallback, correction, grading, or promotion; only a valid model failure may escalate"
    confidence: 0.45
    domain: error-handling
    observations: 1
    first_seen: 2026-07-12
    last_seen: 2026-07-12
    evidence:
      - "2026-07-12 GHCP AIC review: missing OTel and route mismatch previously could trigger correction; phase validity now gates phaseCanCorrect"
